configuration:
  status: warn

  appenders:
    Console:
      name: CONSOLE
      target: SYSTEM_OUT
      PatternLayout:
        pattern: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

  loggers:
    logger:
      - name: "org.omnione.did.oid4vc"
        level: info
      - name: "org.omnione.did.sdjwt"
        level: info
      - name: "org.springframework"
        level: info

  root:
    level: info
    AppenderRef:
      ref: CONSOLE